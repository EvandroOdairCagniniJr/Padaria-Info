# Mantém o Coffee Break rápido no plano grátis, sem custo (Actions é grátis em repositório público):
# - Render free dorme após 15 min sem acesso → uma "cutucada" a cada 10 min o mantém acordado.
# - Supabase free pausa o banco após 7 dias sem atividade → a rota /api/saude/banco faz um "select 1".
#
# Configuração (uma vez): GitHub → Settings → Secrets and variables → Actions → aba Variables →
# New repository variable: nome APP_URL, valor = endereço do Render (ex.: https://padaria-info-xxxx.onrender.com).
# Sem APP_URL, o workflow só avisa e não faz nada.
name: Manter acordado

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  cutucar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cutucar o servidor e o banco
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::Defina a variável APP_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 0
          fi
          # O primeiro acesso pode levar ~1 min se o Render estiver dormindo.
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 "${APP_URL%/}/api/saude/banco"
