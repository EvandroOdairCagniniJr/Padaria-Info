# Deploy no Render (render.com): New → Blueprint → escolha este repositório.
# O banco é o PostgreSQL do Supabase; preencha as variáveis marcadas com sync: false.
services:
  - type: web
    name: padaria-info
    runtime: node
    plan: free
    # Mesma região do banco no Supabase (us-west-2, Oregon): cada consulta leva ~1 ms em vez de
    # ~200 ms. Se o banco for para outra região, troque aqui também.
    region: oregon
    # Com NODE_ENV=production o npm pula as devDependencies, que o build (vite/tsc) precisa.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.ts
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: JWT_SECRET
        generateValue: true
      # Connection string do Supabase (Session pooler, porta 5432).
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
